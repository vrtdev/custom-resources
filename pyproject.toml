[project]
name = "custom_resources"
version = "2.0.0"
description = 'Custom resources for Troposphere/CloudFormation.'
readme = "README.md"
authors = [
    { name = 'VRT DPC', email = 'dpc@vrt.be' },
]
license-files = ["LICENSE.txt"]
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3.14',
]
keywords = ["cloudformation", "aws"]
dependencies = [
    "cfn-custom-resource @ git+https://github.com/vrtdev/cfn-custom-resource",
]
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "boto3>=1.42.4",  # boto3 is included in AWS Lambda and should thus not be installed as a dependency in prod
    "botostubs>=0.15.1.23.10",
    "invoke>=3.0.3",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "troposphere>=4.10.1",
    "twine>=6.2.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]

[tool.uv]
keyring-provider = "subprocess"

[tool.uv.sources]
custom_resources = { index = "nexus" }

[[tool.uv.index]]
name = "nexus"
url = "https://nexus.core.a51.be/repository/pypi"
explicit = true

[tool.ruff]
respect-gitignore = false
line-length = 140
indent-width = 4
extend-exclude = [
    "build",
    "dist",
    "docs",
]

[tool.ruff.lint]
extend-select = [
    "E",
    "W",
    "A",
    "COM",
    "TID",
    "B",
    "SIM",
    "UP",
]
